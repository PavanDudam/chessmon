services:
  - type: web
    name: chessmon-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENGINE_POOL_SIZE
        value: "1"
      - key: ENGINE_HASH_MB
        value: "64"
      - key: DEFAULT_MOVETIME_MS
        value: "500"
      - key: CORS_ORIGINS
        sync: false
